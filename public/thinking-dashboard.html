<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TCD · Gemini Thinking Stream</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0d0d; color: #00ff41; font-family: 'Courier New', monospace; height: 100vh; display: flex; flex-direction: column; }
  #header { padding: 12px 20px; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; gap: 12px; }
  #header h1 { font-size: 13px; color: #888; letter-spacing: 2px; text-transform: uppercase; }
  #status { width: 8px; height: 8px; border-radius: 50%; background: #333; }
  #status.live { background: #00ff41; box-shadow: 0 0 6px #00ff41; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }
  #terminal { flex: 1; overflow-y: auto; padding: 20px; }
  .session { margin-bottom: 24px; }
  .session-header { color: #ffcc00; font-size: 12px; margin-bottom: 8px; }
  .thought-line { font-size: 12px; line-height: 1.7; color: #00cc33; opacity: 0.85; }
  .thought-line::before { content: '› '; color: #005511; }
  .done-line { color: #4af; font-size: 11px; margin-top: 8px; border-top: 1px solid #1a2a1a; padding-top: 8px; }
  #config { padding: 10px 20px; border-top: 1px solid #1a1a1a; display: flex; gap: 10px; align-items: center; }
  #config input { background: #111; border: 1px solid #333; color: #aaa; padding: 6px 10px; font-family: monospace; font-size: 12px; flex: 1; border-radius: 3px; }
  #config button { background: #001a00; border: 1px solid #00ff41; color: #00ff41; padding: 6px 14px; font-family: monospace; font-size: 12px; cursor: pointer; border-radius: 3px; }
</style>
</head>
<body>

<div id="header">
  <div id="status"></div>
  <h1>TCD · Gemini Brain · Live Thinking Stream</h1>
</div>

<div id="terminal">
  <div id="log"></div>
</div>

<div id="config">
  <input id="botUrl" placeholder="Bot URL e.g. https://your-railway-app.up.railway.app" />
  <button onclick="connect()">Connect</button>
</div>

<script>
  let es;

  function connect() {
    const url = document.getElementById('botUrl').value.trim();
    if (!url) return;
    if (es) es.close();

    es = new EventSource(`${url}/thinking-stream`);
    document.getElementById('status').className = 'live';

    let currentSession = null;

    es.onmessage = (e) => {
      const { event, data } = JSON.parse(e.data);
      const log = document.getElementById('log');

      if (event === 'order_start') {
        currentSession = document.createElement('div');
        currentSession.className = 'session';
        currentSession.innerHTML = `<div class="session-header">⬡ ORDER FROM ${data.from} · ${new Date(data.time).toLocaleTimeString()}</div>`;
        log.appendChild(currentSession);
      }

      if (event === 'thought' && currentSession) {
        const line = document.createElement('div');
        line.className = 'thought-line';
        line.textContent = data.text;
        currentSession.appendChild(line);
      }

      if (event === 'order_done' && currentSession) {
        const done = document.createElement('div');
        done.className = 'done-line';
        done.textContent = `✓ Parsed → ${data.parsed.slice(0, 120)}...`;
        currentSession.appendChild(done);
        currentSession = null;
      }

      document.getElementById('terminal').scrollTop = document.getElementById('terminal').scrollHeight;
    };

    es.onerror = () => {
      document.getElementById('status').className = '';
    };
  }
</script>
</body>
</html>
