<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Abuja Ops — Order Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f5f7; color: #1a1a2e; }

  header {
    background: #1a1a2e;
    color: white;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  header span { font-size: 13px; opacity: 0.5; }
  .live-dot { display: inline-block; width: 8px; height: 8px; background: #25d366; border-radius: 50%; margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .stats {
    display: flex;
    gap: 16px;
    padding: 24px 32px 0;
  }
  .stat {
    background: white;
    border-radius: 10px;
    padding: 18px 24px;
    flex: 1;
    border: 1px solid #e8e8e8;
  }
  .stat .label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat .value { font-size: 28px; font-weight: 700; margin-top: 4px; color: #1a1a2e; }
  .stat.green .value { color: #25d366; }
  .stat.amber .value { color: #f59e0b; }

  .controls {
    display: flex;
    gap: 12px;
    padding: 20px 32px 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  input, select {
    padding: 9px 14px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    background: white;
    outline: none;
  }
  input { width: 220px; }
  input:focus, select:focus { border-color: #1a1a2e; }
  .btn-refresh {
    padding: 9px 18px;
    background: #1a1a2e;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    margin-left: auto;
  }
  .btn-refresh:hover { background: #2d2d4e; }

  .table-wrap {
    margin: 0 32px 32px;
    background: white;
    border-radius: 12px;
    border: 1px solid #e8e8e8;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead { background: #f8f9fa; }
  th {
    text-align: left;
    padding: 12px 16px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #888;
    font-weight: 600;
    border-bottom: 1px solid #e8e8e8;
  }
  td { padding: 13px 16px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .badge.new      { background: #dcfce7; color: #16a34a; }
  .badge.pending  { background: #fef9c3; color: #ca8a04; }
  .badge.done     { background: #e0e7ff; color: #4338ca; }

  .dispatcher-tag {
    display: inline-block;
    padding: 3px 10px;
    background: #f0f4ff;
    color: #3b4fc8;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #aaa;
    font-size: 14px;
  }

  .time { color: #aaa; font-size: 12px; }

  #last-updated { font-size: 12px; color: #aaa; margin-left: 8px; }
</style>
</head>
<body>

<header>
  <h1><span class="live-dot"></span>Abuja Ops — Order Dashboard</h1>
  <span id="last-updated">Loading...</span>
</header>

<div class="stats">
  <div class="stat">
    <div class="label">Total orders</div>
    <div class="value" id="stat-total">—</div>
  </div>
  <div class="stat green">
    <div class="label">New today</div>
    <div class="value" id="stat-today">—</div>
  </div>
  <div class="stat amber">
    <div class="label">Dispatchers active</div>
    <div class="value" id="stat-dispatchers">—</div>
  </div>
  <div class="stat">
    <div class="label">Products tracked</div>
    <div class="value" id="stat-products">—</div>
  </div>
</div>

<div class="controls">
  <input type="text" id="search" placeholder="Search customer, dispatcher, product..." oninput="renderTable()"/>
  <select id="filter-dispatcher" onchange="renderTable()">
    <option value="">All dispatchers</option>
  </select>
  <select id="filter-status" onchange="renderTable()">
    <option value="">All statuses</option>
    <option value="new">New</option>
    <option value="pending">Pending</option>
    <option value="done">Done</option>
  </select>
  <button class="btn-refresh" onclick="loadOrders()">↻ Refresh</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Time</th>
        <th>Dispatcher</th>
        <th>Product</th>
        <th>Customer</th>
        <th>Phone</th>
        <th>Qty</th>
        <th>Address</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="orders-body">
      <tr><td colspan="9" class="empty">Loading orders...</td></tr>
    </tbody>
  </table>
</div>

<script>
const SUPABASE_URL = 'https://cnibkphbjautasggyiia.supabase.co';
const SUPABASE_KEY = 'sb_publishable_mUKU80NAIYmS1Gk-S22nAQ_JMZNp1BJ';

let allOrders = [];

async function loadOrders() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/orders?select=*&order=created_at.desc&limit=200`,
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
    );
    allOrders = await res.json();
    updateStats();
    populateFilters();
    renderTable();
    document.getElementById('last-updated').textContent =
      'Updated ' + new Date().toLocaleTimeString('en-NG', { hour: '2-digit', minute: '2-digit' });
  } catch(e) {
    document.getElementById('orders-body').innerHTML =
      `<tr><td colspan="9" class="empty">⚠️ Could not load orders. Check Supabase connection.</td></tr>`;
  }
}

function updateStats() {
  const today = new Date().toDateString();
  const todayOrders = allOrders.filter(o => new Date(o.created_at).toDateString() === today);
  const dispatchers = new Set(allOrders.map(o => o.dispatcher_name)).size;
  const products    = new Set(allOrders.map(o => o.product)).size;

  document.getElementById('stat-total').textContent       = allOrders.length;
  document.getElementById('stat-today').textContent       = todayOrders.length;
  document.getElementById('stat-dispatchers').textContent = dispatchers;
  document.getElementById('stat-products').textContent    = products;
}

function populateFilters() {
  const sel = document.getElementById('filter-dispatcher');
  const current = sel.value;
  const dispatchers = [...new Set(allOrders.map(o => o.dispatcher_name).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">All dispatchers</option>' +
    dispatchers.map(d => `<option value="${d}" ${d===current?'selected':''}>${d}</option>`).join('');
}

function renderTable() {
  const search   = document.getElementById('search').value.toLowerCase();
  const dispFilter = document.getElementById('filter-dispatcher').value;
  const statusFilter = document.getElementById('filter-status').value;

  const filtered = allOrders.filter(o => {
    const matchSearch = !search ||
      (o.dispatcher_name||'').toLowerCase().includes(search) ||
      (o.customer_name||'').toLowerCase().includes(search) ||
      (o.product||'').toLowerCase().includes(search) ||
      (o.customer_phone||'').includes(search);
    const matchDisp   = !dispFilter   || o.dispatcher_name === dispFilter;
    const matchStatus = !statusFilter || o.status === statusFilter;
    return matchSearch && matchDisp && matchStatus;
  });

  if (!filtered.length) {
    document.getElementById('orders-body').innerHTML =
      `<tr><td colspan="9" class="empty">No orders found</td></tr>`;
    return;
  }

  document.getElementById('orders-body').innerHTML = filtered.map((o, i) => {
    const time = new Date(o.created_at).toLocaleString('en-NG', {
      month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'
    });
    const badge = `<span class="badge ${o.status||'new'}">${o.status||'new'}</span>`;
    const disp  = `<span class="dispatcher-tag">${o.dispatcher_name||'—'}</span>`;
    return `<tr>
      <td class="time">${o.id||i+1}</td>
      <td class="time">${time}</td>
      <td>${disp}</td>
      <td><strong>${o.product||'—'}</strong></td>
      <td>${o.customer_name||'—'}</td>
      <td class="time">${o.customer_phone||'—'}</td>
      <td style="text-align:center">${o.quantity||1}</td>
      <td class="time">${o.address||'—'}</td>
      <td>${badge}</td>
    </tr>`;
  }).join('');
}

// Auto-refresh every 30 seconds
loadOrders();
setInterval(loadOrders, 30000);
</script>
</body>
</html>
